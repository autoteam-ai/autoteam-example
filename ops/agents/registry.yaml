# 计费注册表 + 团队清单。受 CODEOWNERS 保护，修改走 PR；每月核对一次各家额度规则。
# Planner 按它选 Implementer 和 Reviewer，autoteam multica 按它创建 agent。
#
# accounts：计费账号。同一个账号下的 agent 共用一份额度。
#   billing：subscription（订阅窗口制）/ credits（包月点数）/ pay_as_you_go（按量）/ free（免费额度，不用于正式项目）
#
# agents：每个 agent 必须写成一行（autoteam 按行解析）。
#   role       planner / implementer / reviewer / auditor；planner 正好 1 个，auditor 最多 1 个
#   account    上面 accounts 里的账号
#   runtime    <provider>@<设备名>，用 `autoteam runtimes` 查可选值；也可以直接写 runtime ID
#   model      default 表示用 runtime 的默认模型；Planner 建议用最强的模型
#   max_tasks  并发上限；Implementer 先设 2，确认评审跟得上再加
#   mcp        可选，MCP 配置文件（相对 ops/agents/），例如 Planner 做线上验收用的 planner-mcp.json
#   env_file   可选，环境变量 JSON 文件（相对仓库根目录），例如按量计费的 API key；放 ops/agents/local/，不要提交

accounts:
  claude-pro:    { billing: subscription,  windows: [5h, weekly] }
  chatgpt-plus:  { billing: subscription,  windows: [5h, weekly] }

# E2E 靶场：全部 agent 跑在 devcontainer.local 这一台机器上，用来验证
# autoteam 本身；名字统一带 ex- 前缀，和 HDGCS 工作区里的正式 agent 区分开。
# 两个 Reviewer 的 env_file 里是 autoteam-bot 的 GitHub token：它们要用一个
# 独立于 Implementer 的账号才能批准 PR（GitHub 不允许作者批准自己的 PR）。
agents:
  ex-planner:     { role: planner,     account: claude-pro,   runtime: claude@devcontainer.local, model: default, max_tasks: 1 }
  ex-impl-claude: { role: implementer, account: claude-pro,   runtime: claude@devcontainer.local, model: default, max_tasks: 2 }
  ex-impl-codex:  { role: implementer, account: chatgpt-plus, runtime: codex@devcontainer.local,  model: default, max_tasks: 2 }
  ex-rev-claude:  { role: reviewer,    account: claude-pro,   runtime: claude@devcontainer.local, model: default, max_tasks: 2, env_file: ops/agents/local/reviewer-env.json }
  ex-rev-codex:   { role: reviewer,    account: chatgpt-plus, runtime: codex@devcontainer.local,  model: default, max_tasks: 2, env_file: ops/agents/local/reviewer-env.json }
  ex-auditor:     { role: auditor,     account: claude-pro,   runtime: claude@devcontainer.local, model: default, max_tasks: 1 }
